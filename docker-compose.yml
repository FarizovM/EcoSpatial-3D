version: "3.8"

services:
  # База даних з PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: ecospatial_db
    restart: always
    environment:
      POSTGRES_USER: eco_user
      POSTGRES_PASSWORD: eco_password
      POSTGRES_DB: ecospatial
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - eco_network

  # Redis для WebSockets та кешування
  redis:
    image: redis:7-alpine
    container_name: ecospatial_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - eco_network

  # PgAdmin для зручного перегляду геоданих (опціонально, але зручно)
  pgadmin:
    image: dpage/pgadmin4
    container_name: ecospatial_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eco.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - eco_network

volumes:
  pgdata:
  redisdata:

networks:
  eco_network:
    driver: bridge
